# Production profile — activated with SPRING_PROFILES_ACTIVE=prod
# Every value comes from environment variables; nothing secret is stored here.
# The local application.properties is gitignored and never reaches the server.
spring.application.name=psylog-api

# Server — hosting platforms inject PORT
server.port=${PORT:8080}

# Database — DATABASE_URL must be in JDBC form: jdbc:postgresql://host:port/dbname
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Admin seed — only inserted when the user table is empty
admin.email=${ADMIN_EMAIL}
admin.password=${ADMIN_PASSWORD}

# CORS — comma separated origin list
cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Auth cookie — cross-site cookie between api.* and the frontend domain
cookie.secure=${COOKIE_SECURE:true}
cookie.same-site=${COOKIE_SAME_SITE:None}
cookie.domain=${COOKIE_DOMAIN}

# Mail (Gmail SMTP) — MAIL_APP_PASSWORD must be a Gmail app password
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_APP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Notification target email
app.notification.email=${NOTIFICATION_EMAIL}

# API docs are not public in production
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Do not leak internals in error responses
server.error.include-stacktrace=never
server.error.include-message=never
logging.level.org.hibernate.SQL=WARN
