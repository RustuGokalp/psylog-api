# In-memory database for tests — never touches PostgreSQL
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# JWT — test-specific values
jwt.secret=test-secret-key-that-is-long-enough-for-hmac-sha-256
jwt.expiration=3600000

# Admin seed
admin.email=admin@test.com
admin.password=admin123

# CORS
cors.allowed-origins=http://localhost:3000

# Auth cookie
cookie.secure=false
cookie.same-site=Lax
cookie.domain=

# Mail — no mail is actually sent in tests, this only wires up the JavaMailSender bean
spring.mail.host=localhost
spring.mail.port=3025
spring.mail.username=test
spring.mail.password=test
app.notification.email=test@test.com
